<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact sheet</title>
<link rel="stylesheet" href="https://use.typekit.net/gfn7ugl.css">
<style>
  body { margin: 0; padding: 16px; background: #E4E2DC; font: 500 12px/1.3 "neue-haas-grotesk-text", "Helvetica Neue", sans-serif; color: #1A1714; }
  .sheet { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  figure { margin: 0; }
  canvas { display: block; box-shadow: 0 10px 24px -14px rgba(0,0,0,.5); }
  figcaption { margin-top: 6px; color: #6E6860; }
</style>
</head>
<body>
  <!-- Every preset as a still, side by side. ?t=0.25 picks the moment, ?h=320 the height,
       ?only=melt,liquid just the presets whose file names contain those words. -->
  <div class="sheet" id="sheet"></div>
  <script type="module">
    import { manifest, render, size, fontRequest, clearMetrics, frameCount } from "../elastic.js"
    import { sanitize } from "../../../packages/core/patch.js"
    import { ensureFont } from "../../../packages/core/fonts.js"
    import { prepareMarks } from "../../../packages/core/marks.js"
    const q = new URLSearchParams(location.search)
    const t = +(q.get("t") ?? 0.25), height = +(q.get("h") ?? 300)
    const only = q.get("only")?.split(",")
    const files = (await fetch("../presets/index.json").then((r) => r.json())).filter((f) => !only || only.some((o) => f.includes(o)))
    for (const f of files) {
      const raw = await fetch(`../presets/${f}`).then((r) => r.json())
      const patch = sanitize(manifest, raw)
      await ensureFont(fontRequest(patch))
      const marks = await prepareMarks(patch)
      clearMetrics()
      const { w, h } = size(patch), s = (height * 2) / h
      const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(w * s), height: height * 2 })
      canvas.style.height = `${height}px`
      render(canvas.getContext("2d", { willReadFrequently: true }), patch, t, { scale: s, frame: Math.floor(t * frameCount(patch)), marks })
      const fig = document.createElement("figure")
      const cap = document.createElement("figcaption")
      cap.textContent = raw.name ?? f
      fig.append(canvas, cap)
      document.getElementById("sheet").append(fig)
    }
  </script>
</body>
</html>
